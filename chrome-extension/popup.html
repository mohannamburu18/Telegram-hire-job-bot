<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TeleHire Copilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wh-popup-container">
    <!-- Header -->
    <header class="wh-header">
      <div class="wh-brand">
        <div class="wh-logo-icon">TH</div>
        <div>
          <h2>TeleHire</h2>
          <span class="wh-tagline">Real-Time Application Copilot</span>
        </div>
      </div>
      <span id="popup-plan-tag" class="wh-version-tag">Verified Paid</span>
    </header>

    <!-- Side Panel Opener Primary Action -->
    <div class="wh-card" style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #38bdf8; padding: 12px; border-radius: 8px;">
      <h3 style="font-size: 13px; font-weight: 700; color: #f8fafc; margin-bottom: 4px;">🚀 Persistent Copilot Side Panel</h3>
      <p style="font-size: 11px; color: #94a3b8; line-height: 1.4; margin-bottom: 10px;">
        Keep TeleHire open alongside job application pages without disappearing.
      </p>
      <button id="btn-open-sidepanel" class="wh-btn-fill-action" style="background: linear-gradient(135deg, #2563eb, #38bdf8); font-size: 12px; padding: 10px;">
        📌 Open Persistent Side Panel
      </button>
    </div>

    <!-- Quick Action -->
    <div class="wh-action-box" style="display: flex; flex-direction: column; gap: 6px;">
      <button id="btn-trigger-fill" class="wh-btn-fill-action">
        ⚡ Fill Form on Current Tab
      </button>
    </div>

    <!-- Footer Links -->
    <footer class="wh-footer">
      <a href="https://t.me/TeleHireJOB_bot" target="_blank" class="wh-bot-link">
        🤖 Open @TeleHireJOB_bot
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
